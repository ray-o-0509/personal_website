name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read # Claude が PR の CI 結果を読むために必要

jobs:
  claude:
    # @claude メンションを含むコメント/レビュー/Issue のときだけ起動
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # prompt を渡さない = tag モード。@claude メンションに返信コメントを投稿する。
          claude_args: |
            --model claude-opus-4-8
            --max-turns 30
            --system-prompt "必ず日本語で回答する。このリポジトリは Next.js 16 App Router / React 19 / TypeScript / Tailwind CSS v4 で作られた個人ポートフォリオサイト rayotsuka.com（Vercel デプロイ、日本語・英語の2言語）。レビューでは次を重点的に見る: (1) アクセシビリティ — セマンティックな要素、代替テキスト、キーボード操作とフォーカス可視性、色コントラスト; (2) パフォーマンス — next/image と next/font の使い方、不要な use client によるクライアント化、バンドルと画像サイズ; (3) SEO/OGP — layout.tsx や generateMetadata の title/description/canonical/OG 画像、ロケール別 alternates の整合; (4) 多言語 — src/i18n の en.ts と ja.ts でキーと文言が揃っているか、文字列のハードコードがないか; (5) src/app/api/contact のフォーム経路 — 入力バリデーション、スパム対策、シークレットやメールアドレスの取り扱い。指摘は重要度順に、該当ファイルと行を挙げて簡潔に述べる。"
